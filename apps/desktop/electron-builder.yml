# Packaging. The app is fully bundled by electron-vite into out/ (no runtime node_modules).
appId: io.github.micka420collab.nova
productName: NOVA
executableName: nova
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
icon: build/icon.png
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
linux:
  target:
    - AppImage
    - dir
  category: Development
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.png
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
