packages:
  - apps/*
  - packages/*

# Supply-chain cooldown: freshly published versions are skipped for 3 days.
minimumReleaseAge: 4320

# Explicit, reviewed exceptions to the cooldown (versions selected on 2026-09-27).
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - react-resizable-panels@4.14.0
  - vitest@5.0.2

# Only these dependencies may run install scripts (Electron downloads its binary).
allowBuilds:
  electron: true
  esbuild: true
  # Squirrel installer tooling is unused (NSIS target); its install script is not needed.
  electron-winstaller: false
