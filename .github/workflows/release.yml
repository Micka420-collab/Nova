name: Release

# Builds the installers on each OS and publishes them as a GitHub pre-release.
# Trigger: push a tag vX.Y.Z (notes read from docs/releases/vX.Y.Z.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        # One mac runner per shipped arch: pnpm installs native optional deps (the ripgrep binary)
        # for the host cpu only, and electron-builder packs the host arch (electron-builder.yml).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install Electron binary
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Check the tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build installers
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Display for the self-test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Native deps (node-pty, ripgrep) must load from the packaged app of the arch being shipped.
      - name: Self-test the packaged app
        working-directory: apps/desktop
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}node e2e/packaged-selftest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "NOVA ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --prerelease --verify-tag
